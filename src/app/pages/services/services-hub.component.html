<main class="service-layout" aria-labelledby="servicios-h1">
  <nav aria-label="Migas de pan" class="mb-8 text-sm text-muted"><a href="/" class="hover:text-brand-dark">Inicio</a> <span aria-hidden="true">›</span> Servicios</nav>
  <div class="service-header">
    <div><p class="rise-eyebrow">Servicios en Hermosillo</p><h1 id="servicios-h1">Servicios médicos en Hermosillo</h1><p class="hero-support">Conoce los servicios de Servicios Médicos RISE y escríbenos por WhatsApp para recibir información detallada.</p></div>
    <img class="service-photo" src="/fondo.webp" width="1280" height="960" alt="Consultorio de Servicios Médicos RISE" />
  </div>
  <section aria-labelledby="servicios-disponibles">
    <div class="rise-section-heading"><p class="rise-eyebrow">Lo que hacemos</p><h2 id="servicios-disponibles">Servicios disponibles</h2></div>
    <div class="service-grid">
      <app-service-card *ngFor="let card of cards; let i = index" [card]="card" [number]="'0' + (i + 1)"></app-service-card>
    </div>
  </section>
  <aside class="mt-12" [innerHTML]="whereWhenHtml"></aside>
  <footer class="mt-10 border-t border-line pt-6"><nav aria-label="Páginas legales" class="flex flex-wrap gap-x-5 gap-y-2 text-sm font-semibold"><a href="/aviso-de-privacidad" class="text-muted hover:text-brand-dark">Aviso de privacidad</a><a href="/terminos" class="text-muted hover:text-brand-dark">Términos y condiciones</a></nav></footer>
</main>
