<div *ngIf="isBootstrapping" class="page-shell py-16 flex justify-center items-center gap-3 text-brand-dark font-semibold">
  <span class="h-5 w-5 rounded-full border-2 border-brand/30 border-t-brand animate-spin"></span>
  Cargando...
</div>

<div *ngIf="!isBootstrapping && mode === 'create' && showTemplatePicker" class="page-shell space-y-6">
  <header class="surface-card px-6 py-5">
    <p class="text-sm font-semibold text-accent mb-1">Nueva consulta</p>
    <h1 class="font-display text-3xl font-bold text-ink">Selecciona la plantilla</h1>
    <p class="text-muted mt-1">
      Elige el tipo de consulta. Médico general y podología ya están disponibles.
    </p>
  </header>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <button
      type="button"
      *ngFor="let template of templates"
      class="surface-card text-left p-6 hover:border-brand transition border border-line"
      (click)="selectTemplate(template.key)"
    >
      <div class="flex items-start justify-between gap-3 mb-3">
        <h2 class="font-display text-xl font-bold text-ink m-0">{{ template.title }}</h2>
        <span
          class="text-xs font-bold px-2.5 py-1 rounded-full whitespace-nowrap"
          [class.bg-emerald-100]="template.ready"
          [class.text-emerald-800]="template.ready"
          [class.bg-amber-100]="!template.ready"
          [class.text-amber-800]="!template.ready"
        >
          {{ template.ready ? 'Lista' : 'Campos pendientes' }}
        </span>
      </div>
      <p class="text-muted text-sm m-0 leading-relaxed">{{ template.description }}</p>
    </button>
  </div>

  <button type="button" class="btn-brand-outline" (click)="onGoBack()">Cancelar</button>
</div>

<app-consultation-form
  *ngIf="!isBootstrapping && !showTemplatePicker"
  [mode]="mode"
  [consultationData]="consultationData"
  [patientsList]="patientsList"
  [getStaffNameFn]="getStaffNameFn"
  [showBackButton]="false"
  [allowChangeTemplate]="mode === 'create'"
  (changeTemplateClicked)="changeTemplate()"
  (formSubmitted)="onFormSubmitted($event)"
  (formCancelled)="onFormCancelled()"
  (goBackClicked)="onGoBack()"
></app-consultation-form>
