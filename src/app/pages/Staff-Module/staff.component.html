<div class="page-shell space-y-6">
  <header class="surface-card px-4 sm:px-6 py-4 sm:py-5 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
    <div>
      <p class="text-sm font-semibold text-accent mb-1">Equipo</p>
      <h1 class="font-display text-2xl sm:text-3xl font-bold text-ink">Staff</h1>
      <p class="text-muted mt-1">Alta y gestión de médicos y auxiliares</p>
    </div>
    <button type="button" class="btn-brand w-full sm:w-auto" (click)="openCreateModal()">
      <mat-icon fontIcon="person_add"></mat-icon>
      Nuevo staff
    </button>
  </header>

  <div class="surface-card p-4">
    <input
      type="text"
      [(ngModel)]="searchTerm"
      placeholder="Buscar por nombre, correo o cédula..."
      class="input-brand w-full max-w-md"
    />
  </div>

  <div class="surface-card overflow-hidden">
    <div *ngIf="isLoading" class="flex justify-center items-center py-12 gap-3 text-brand-dark font-semibold">
      <span class="h-5 w-5 rounded-full border-2 border-brand/30 border-t-brand animate-spin"></span>
      Cargando staff...
    </div>

    <div *ngIf="!isLoading && filteredStaff.length === 0" class="p-10 text-center text-muted">
      No hay miembros registrados.
    </div>

    <div class="overflow-x-auto" *ngIf="!isLoading && filteredStaff.length > 0">
      <table class="min-w-full">
        <thead class="bg-brand-soft/60">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-bold uppercase tracking-wide text-muted">Nombre</th>
            <th class="px-6 py-3 text-left text-xs font-bold uppercase tracking-wide text-muted">Correo</th>
            <th class="px-6 py-3 text-left text-xs font-bold uppercase tracking-wide text-muted">Rol</th>
            <th class="px-6 py-3 text-left text-xs font-bold uppercase tracking-wide text-muted">Cédula</th>
            <th class="px-6 py-3 text-left text-xs font-bold uppercase tracking-wide text-muted">Firma</th>
            <th class="px-6 py-3 text-left text-xs font-bold uppercase tracking-wide text-muted">Estado</th>
            <th class="px-6 py-3 text-left text-xs font-bold uppercase tracking-wide text-muted">Acciones</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-line">
          <tr *ngFor="let member of filteredStaff" class="hover:bg-brand-soft/40 transition-colors">
            <td class="px-6 py-4 text-sm font-semibold text-ink">{{ member.name }}</td>
            <td class="px-6 py-4 text-sm text-muted">{{ member.email }}</td>
            <td class="px-6 py-4 text-sm text-muted">{{ roleLabel(member.role) }}</td>
            <td class="px-6 py-4 text-sm text-muted">{{ member.cedula || '—' }}</td>
            <td class="px-6 py-4 text-sm text-muted">
              <img
                *ngIf="member.signatureDataUrl; else noSignature"
                [src]="member.signatureDataUrl"
                alt="Firma"
                class="h-8 w-auto max-w-[6rem] object-contain"
              />
              <ng-template #noSignature>—</ng-template>
            </td>
            <td class="px-6 py-4 text-sm">
              <span
                class="inline-flex px-2.5 py-1 rounded-full text-xs font-bold"
                [class]="member.isActive ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'"
              >
                {{ member.isActive ? 'Activo' : 'Inactivo' }}
              </span>
            </td>
            <td class="px-4 sm:px-6 py-4 text-sm">
              <div class="flex flex-col sm:flex-row gap-2 min-w-[7rem]">
                <button type="button" class="btn-brand-outline text-xs py-1.5 px-3 w-full sm:w-auto" (click)="openEditModal(member)">
                  Editar
                </button>
                <button
                  *ngIf="member.isActive"
                  type="button"
                  class="text-xs font-semibold text-red-600 hover:underline px-2 py-1.5 text-center"
                  (click)="deactivate(member)"
                >
                  Desactivar
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
