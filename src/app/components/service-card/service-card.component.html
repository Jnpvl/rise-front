<a class="rise-card service-card-typographic" [href]="card.enlace" [routerLink]="card.enlace">
  <img *ngIf="imagen" class="service-card-image" [src]="imagen" width="640" height="480" [alt]="card.titulo" />
  <div class="service-card-accent" aria-hidden="true"></div>
  <p class="service-card-eyebrow" *ngIf="number || card.enlace">{{ number || card.enlace }}</p>
  <h3>{{ card.titulo }}</h3>
  <p>{{ card.linea }}</p>
  <span class="service-card-link">Ver más →</span>
</a>
