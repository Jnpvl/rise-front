<a class="rise-card service-card-typographic" [href]="card.slug" [routerLink]="card.slug">
  <img *ngIf="imagen" class="service-card-image" [src]="imagen" width="640" height="480" [alt]="card.name" />
  <div class="service-card-accent" aria-hidden="true"></div>
  <p class="service-card-eyebrow" *ngIf="number || card.key">{{ number || card.key }}</p>
  <h3>{{ card.name }}</h3>
  <p>{{ card.summary }}</p>
  <span class="service-card-link">Ver más →</span>
</a>
